<!-- SECURITY: only NeuroNet's own scripts run (test_security.py): 'self' is pywebview's
     server of ui/ on 127.0.0.1, file: the same files opened directly. The hash is the
     UI-scale snippet below -- change that snippet and the hash must change too.
     'unsafe-eval' is pywebview's (its bridge is built with new Function). -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' file: 'sha256-6vYqmOWMLO8YlZIAT2GSQWRzmpr3nQ1WaIOWHGVWT2w=' 'unsafe-eval' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'none'; form-action 'none'">
<script>
/* UI scale, applied before the first paint -- otherwise the window would
   draw at 100% and then jump to the chosen size a moment later. The saved
   value lives in prefs; this cached copy only exists to beat that jump,
   and app.js corrects it if the two ever disagree. */
(function () {
  try {
    var z = parseFloat(localStorage.getItem("ss:uiScale"));
    if (z >= 0.5 && z <= 3) {
      document.documentElement.style.zoom = z;
      document.documentElement.style.setProperty("--ss-zoom", z);
    }
  } catch (e) { /* storage unavailable: 100% is fine */ }
})();
</script>

    <nav id="ss-nav"></nav>

        <svg class="ic" viewBox="0 0 24 24"><use href="#i-settings"/></svg>
        <span class="ss-label">Settings</span></button>
    </div>

  <!-- ONE APP. Cam: "make that top bar the default for the entire app ...
       Think of NeuroNet as one complete app with multiple tools, don't treat
       it as separate applications within NeuroNet."

       The bar used to live inside the music section and only showed there.
       It now sits across the top of the whole content side, above every
       tool, and each tool keeps only the controls that belong to it.
       Everything except the sidebar lives in this column: the bar, then the
       stage where whichever tool is open is drawn. -->
  <div id="ss-column">
    <div id="ss-topbar">
<div id="ch-top-bar">
  <!-- Toggles the left-hand navigation sidebar — Cam: "add a hide
       menu button for the menu (similar to the hide playlist
       sidebar)." Pinned to the far left, same real pattern as the
       right panel's own toggle below. -->
  <button id="ch-menu-toggle" class="chord-btn sm" type="button"
          title="Menu" aria-label="Show or hide the navigation menu"
          aria-pressed="true"></button>

  <span id="ch-top-bar-clock"></span>

  <div id="cc-mini" class="cc-mini">

            title="Previous" aria-label="Previous track"></button>
    <button id="cc-mini-play" class="chord-btn" type="button"
            title="Play" aria-label="Play or pause"></button>
    <button id="cc-mini-next" class="chord-btn sm" type="button"
            title="Next" aria-label="Next track"></button>
    <span id="cc-mini-art" class="cc-mini-art" aria-hidden="true"></span>

    </div>

    <button id="cc-mini-fav" class="chord-btn sm cc-mini-fav" type="button"

    <button id="cc-mini-add" class="chord-btn sm" type="button"
            title="Add to a playlist" aria-label="Add this song to a playlist">+</button>
    <button id="cc-mini-note" class="chord-btn sm" type="button"
            title="Queue" aria-label="Show the play queue"></button>
  </div>

  <!-- Toggles the right-hand playlist panel — lives in the top bar so
       it's reachable from every section, not just Playlists. -->
  <div id="ss-topbar-end">

       selected, but i dont want its icon to mirror the main and sub section
       icons." A bare outline in the theme's accent, no tinted tile: it reads

<!-- The queue popover the ♪ button opens.

     IT LIVES IN THE BAR, not in the music shell. Cam: "please fix this
     mini pop up, it only opens when in music main section."

     It used to be the first child of #ch-shell, and the router hides
     every element whose id ends in "-shell" the moment you leave its
     section. A child of a hidden element cannot be shown, whatever
     class you put on it -- so the popover was told to open, took the
     class, computed display: block, and still measured 0x0. Measured
     exactly that: open true, display block, 330x526 in Music and 0x0
     in every other section, hidden by "ch-shell [hidden]".

     The styles for this placement were already written and had never
     matched anything: topbar.css carries both
     "#ss-topbar .cc-queue-pop" and its ".open" rule, which is the bar
     this belongs to. Outside #ss-topbar those never applied and the
     shell-scoped pair in chords.css did the work instead.

     position: fixed, so being in the bar does not confine it -- and
     when the bars are hidden with F9 the popover goes with them, which
     is right: it is the bar's own panel. -->
<div id="cc-queue-pop" class="cc-queue-pop"></div>
    </div>
    <!-- A section's pages as tabs (2026-10-05, the audit: the right-hand menu
         took 210px from every page). Photos keeps its menu (folders, albums,
         tags); "Menu on the right" at the end switches back. -->
    <nav id="ss-tabs" aria-label="Pages in this section" hidden></nav>
    <div id="ss-stage">

  <main id="ss-main"></main>

<!-- Code -> IDE: Algorithm's editor. Empty here: ide.js draws Algorithm's
     own page into this element's shadow root the first time Code opens, so
     its ids and styles (it has a #toast and a .sheet too) never meet
     NeuroNet's. Hidden, not destroyed, when another screen opens -- open
     files keep their undo history and a running command keeps running. -->
<div id="code-shell" hidden></div>

<!-- ==========================================================================
     Coach Cam's shell, inline and hidden until the training module is opened.
     ==========================================================================
     It lives in the document from the start rather than being injected on
     demand, because Coach Cam's app.js wires its event listeners at PARSE
     time, not inside init(). Injected later, every one of those lookups
     came back null and the file threw before it finished loading.

     So the markup is here, the scripts below find exactly what they expect,
     and opening Training is only a matter of showing it. Nothing is moved
     in the DOM either -- moving a subtree would tear down and rebuild every
     listener attached to it.

     Its own sidebar, scrim and resizers are hidden by the stylesheet:
     NeuroNet's sidebar drives navigation now, but app.js writes to #nav and
     #dataStamp without checking they exist, so the markup has to stay.
     ========================================================================= -->
<!-- Lens: the read-only gym view. Bigger text, no save path anywhere in
     its file -- safe to leave open on a phone propped against a rack.
     Inline and hidden for the same reason as the shell below: its script
     wires itself at parse time. Its ids are all prefixed "lens-" because
     it shipped as its own window and had its own #toast and #sheetHost,
     which the shell also has. -->

<!-- ==========================================================================
     Cranium's shell, inline and hidden until a Games view is opened.
     ==========================================================================
     It lives in the document from the start rather than being injected on
     demand, because Cranium's app.js wires its listeners at PARSE time, not
     inside boot(). Injected later every one of those lookups came back null
     and the file threw before it finished loading -- the same lesson Coach
     Cam's shell taught in KinCrux.

     Every id is prefixed "cr-": Cranium's were #app, #sidebar, #content,
     #toasts and #modal-veil, all of which NeuroNet also has. Its dialog
     and toast styling is scoped to this element, so sharing the host's
     containers would have left every Cranium dialog unstyled.

     Its own sidebar is hidden by the stylesheet -- NeuroNet's sidebar
     drives navigation now -- but the element stays, because renderSidebar()
     writes to it without checking it exists.
     ========================================================================= -->
<div id="cr-shell" hidden>

  <header id="cr-topbar">
    <span id="cr-brand">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-brain"/></svg>
      Cranium
    </span>
    <span id="cr-topbar-title"></span>
    <span class="spacer"></span>
    <div id="cr-topbar-actions" class="row"></div>
    <div id="cr-zoom" class="row" title="Zoom (Ctrl +/- , Ctrl 0 to reset)">
      <button class="cc-zoom-btn" id="cr-zoom-out" aria-label="Zoom out">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <span id="cr-zoom-level">100%</span>
      <button class="cc-zoom-btn" id="cr-zoom-in" aria-label="Zoom in">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="cr-clock" aria-label="Current time"></div>
  </header>

  <div id="cr-body">
    <aside id="cr-sidebar"></aside>
    <main id="cr-content"></main>
  </div>
  <!-- Inside the shell, like Celestial's: cranium.css styles these as
       "#cr-shell #cr-modal-veil" and so on, and gets its colours from the
       shell. Left outside it, every Puzzles dialog (Add to book, confirm)
       and toast drew unstyled below the bottom of the window, so "Add to
       book" looked like it did nothing. -->
  <div id="cr-modal-veil"></div>
  <div id="cr-confirm-veil"></div>
  <div id="cr-toasts" aria-live="polite"></div>
</div>

<!-- ==========================================================================
     Celestial's shell: divination and mindfulness, hidden until opened.
     ==========================================================================
     Inline for the same reason Cranium's is -- its scripts wire
     themselves at parse time. Its top nav is deliberately NOT here:
     NeuroNet's sidebar does that job now, and the document-wide click
     handler that closed its dropdowns would have fired on every click
     in the host.

     Ids prefixed "cs-": #app, #toasts, #modal-veil and #confirm-veil
     are all names NeuroNet already owns, and Celestial's dialog
     styling is scoped to this element.
     ========================================================================= -->
<div id="cs-shell" hidden>
  <div id="cs-app"></div>
  <div id="cs-toasts" aria-live="polite"></div>
  <div id="cs-modal-veil"></div>
  <div id="cs-confirm-veil"></div>
</div>

<!-- ==========================================================================
     Chords' shell: the music module, hidden until a Music view is opened.
     ==========================================================================
     Its own top bar is in here but not drawn -- the mini player moved to
     NeuroNet's sidebar, where every screen can see it, which is what
     background play has to mean. The bar stays in the document because
     the player writes to its elements without checking they exist.

     The <audio> element is NOT in here. chords_player.js appends it to
     document.body, which is exactly why the music survives hiding this
     shell to show a game.
     ========================================================================= -->
<div id="ch-shell" hidden>

<!-- The app shell: a persistent left nav, the main content area
     chords.js still owns, and a persistent, toggleable right panel.
     Both sidebars live outside #app for the exact same reason the
     top bar does — chords.js replaces #app's innerHTML on every
     section switch, and an element owned by that render pass would
     be destroyed the instant the section changed. -->
<div id="ch-inner">
  <nav id="ch-sidebar-left" aria-label="Main navigation"></nav>
  <main id="ch-app"></main>
  <aside id="ch-sidebar-right" aria-label="Playlist panel"></aside>
</div>

<!-- shared chrome -->
<div id="ch-toasts" aria-live="polite"></div>
<div id="ch-modal-veil"></div>
<!-- CC.confirm's own stacking overlay, separate from #modal-veil, so a
     confirm launched from inside an already-open dialog (a delete
     confirmation from inside the Track details editor, say) can never
     clobber that dialog's own live DOM. -->
<div id="ch-confirm-veil"></div>
</div>


          <!-- The right bar: the subsections of whatever main section is open.
           Cam: "the right navbar containing all the sub sections of that
           main section. For example Sessions is a sub section of Training." -->

        <div id="ss-subnav-foot"></div>
      </aside>
    </div>
    <!-- Where you are: "Training - Sessions". -->

  </div>
</div>
