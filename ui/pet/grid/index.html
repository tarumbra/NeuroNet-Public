<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid world (prototype)</title>
<!-- The Grid game prototype (Collaboration project "Grid game", 2026-10-18): the main island as a tile grid you walk around,
     RuneScape / RPG MO style. It reads the game's own rules and pictures (petcore.js, petart.js, the art manifests) but keeps
     its own little save -- nothing here touches your real game or the sandbox. -->
<link rel="stylesheet" href="grid.css">
</head>
<body>
<div class="g-app" id="g-app">
  <header class="g-top">
    <div class="g-where"><b id="g-area">Neurovale</b><span id="g-areasub"></span></div>
    <div class="g-bars">
      <div class="g-bar hp" title="Health"><span id="g-hp"></span><em id="g-hpn"></em></div>
      <div class="g-bar sp" title="Special / fury"><span id="g-sp"></span><em id="g-spn"></em></div>
    </div>
    <div class="g-specs" id="g-specs"></div>
    <div class="g-sound"><button class="g-btn" id="g-mute" title="Sound on or off">Sound: on</button>
      <input type="range" id="g-vol" min="0" max="100" value="60" aria-label="Volume"></div>
    <button class="g-btn" id="g-reset" title="Start the prototype again">Reset</button>
  </header>
  <main class="g-main">
    <div class="g-stage" id="g-stage"><canvas id="g-canvas" aria-label="The world: click a tile to walk, a node to gather, a creature to fight"></canvas>
      <div class="g-float" id="g-float"></div></div>
    <aside class="g-side">
      <nav class="g-tabs"><button class="g-tab on" data-tab="bag">Bag</button><button class="g-tab" data-tab="skills">Skills</button><button class="g-tab" data-tab="help">How to</button></nav>
      <div class="g-pane" id="g-pane"></div>
    </aside>
  </main>
  <footer class="g-log" id="g-log" aria-live="polite"></footer>
</div>
<div class="g-start" id="g-start" hidden></div>
<script src="../petcore.js"></script>
<script src="../petart.js"></script>
<script src="../art/icons/manifest.js"></script>
<script src="../art/creatures/manifest.js"></script>
<script src="grid.js"></script>
</body>
</html>
