<!-- ==========================================================================
     Coach Cam's shell, inline and hidden until the training module is opened.
     ==========================================================================
     It lives in the document from the start rather than being injected on
     demand, because Coach Cam's app.js wires its event listeners at PARSE
     time, not inside init(). Injected later, every one of those lookups
     came back null and the file threw before it finished loading.

     So the markup is here, the scripts below find exactly what they expect,
     and opening Training is only a matter of showing it. Nothing is moved
     in the DOM either -- moving a subtree would tear down and rebuild every
     listener attached to it.

     Its own sidebar, scrim and resizers are hidden by the stylesheet:
     KinCrux's sidebar drives navigation now, but app.js writes to #nav and
     #dataStamp without checking they exist, so the markup has to stay.
     ========================================================================= -->
<!-- Lens: the read-only gym view. Bigger text, no save path anywhere in
     its file -- safe to leave open on a phone propped against a rack.
     Inline and hidden for the same reason as the shell below: its script
     wires itself at parse time. Its ids are all prefixed "lens-" because
     it shipped as its own window and had its own #toast and #sheetHost,
     which the shell also has. -->
<!-- Amnesia's shell: the notes vault. Inline and hidden for the same
     reason as the two below -- its app.js wires listeners at parse time,
     so injecting the markup later made every lookup return null.

     Its own #modal-veil, #confirm-veil and #toasts are renamed "cx-" and
     kept in here: KinCrux has those ids too, and Amnesia's dialog
     styling is scoped to this element, so sharing the host's would have
     left every dialog body unstyled. -->

            <button class="cx-tool" data-cmd="quote" title="Quote" aria-label="Quote"><svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-quote"/></svg></button>
            <span class="cx-tool-sep" aria-hidden="true"></span>
            <button class="cx-tool" data-cmd="wikilink" title="Link to a note" aria-label="Link to a note"><svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-wikilink"/></svg></button>
            <button class="cx-tool" data-cmd="link" title="Web link" aria-label="Web link"><svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-link"/></svg></button>
            <button class="cx-tool" data-cmd="code" title="Code" aria-label="Code"><svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-code"/></svg></button>
            <button class="cx-tool" data-cmd="table" title="Table" aria-label="Table"><svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-table"/></svg></button>
            <button class="cx-tool" data-cmd="rule" title="Divider" aria-label="Divider"><svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-rule"/></svg></button>
          </div>
        </div>
        </div>
        <div id="cx-split-divider" style="display:none" title="Drag to resize"></div>
        <div id="cx-split-area" style="display:none">
          <div id="cx-split-topbar">
            <div id="cx-split-breadcrumb"></div>
            <div id="cx-split-pdf-zoom-control" style="display:none">
              <button class="cx-icon-btn" id="cx-split-pdf-zoom-out"
                      title="Zoom out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2"><path d="M5 12h14"/></svg>
              </button>
              <button class="cx-icon-btn" id="cx-split-pdf-zoom-in"
                      title="Zoom in">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <div class="cx-mode-toggle" id="cx-split-mode-toggle">
              <button data-mode="edit" class="cx-on" title="Edit (raw markdown)"
                      aria-label="Edit">
                <svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-pencil"/></svg>
              </button>
              <button data-mode="preview" title="View (formatted, editable)"
                      aria-label="View">
                <svg class="cx-ic" viewBox="0 0 24 24"><use href="#i-eye"/></svg>
              </button>
            </div>
            <button class="cx-icon-btn" id="cx-split-close"
                    title="Close split">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>

          </div>
          <div id="cx-split-editor-area"></div>
        </div>
      </div>
    </div>

        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Coach Cam</span>
      </div>

      <svg class="ic search-ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>

    </div>

  <div class="resizer" id="resizeSidebar" role="separator"
       aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>

<script src="training/programs.js"></script>
<script src="training/lessons.js"></script>
<script src="training/books.js"></script>

<script src="training/app.js"></script>
