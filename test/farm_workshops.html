<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NeuroFarm workshops test</title>
<!-- Driven by test_farm_workshops.py in headless Chromium: the real page (ui/farm/*) on a made-up farm
     (window.NFStore, so nothing is saved anywhere), clicked through the Workshops yard and a sheet.
     The results go into #out as JSON. -->
<link rel="stylesheet" href="../ui/farm/farm.css"></head>
<body class="nf"><div class="nf-app"><nav class="nf-rail"><div class="nf-logo"><img alt="" id="nf-logo"></div><div class="nf-nav" id="nf-nav"></div></nav>
<div class="nf-stage"><header class="nf-hud"><div class="nf-title"><b id="nf-farm">NeuroFarm</b><small id="nf-farmer"></small></div><div class="nf-stats" id="nf-stats"></div></header>
<main class="nf-main" id="nf-main"></main></div></div><div class="nf-toasts" id="nf-toasts"></div>
<pre id="out">running</pre>
<script src="../ui/farm/farmcore.js"></script>
<script>
  (function () {
    const F = window.FarmCore, now = Date.now();
    let s = F.act(F.empty(), "start", {farmer: "Tester", farm: "Test Farm"}, now - 3600e3).state;
    s.xp = F.XP[18]; s.coins = 25000; s.kitchen = 3; s.dairy = 1; s.loom = 2; s.mill = 0;
    Object.assign(s.silo, {wheat: 25, strawberry: 5, carrot: 6, potato: 4, egg: 5, milk: 4, wood: 35, sugarcane: 12});
    s.cooking = [{recipe: "bread", maker: "kitchen", at: now - 30 * 60e3, until: now - 60e3, done: true},
                 {recipe: "applepie", maker: "kitchen", at: now - 20 * 60e3, until: now + 70 * 60e3, done: false}];
    s.parcels.push("1,0"); const p = F.act(s, "place", {house: "coop", x: 4, y: 0}, now - 3600e3); if (p.ok) s = p.state;   // a building on the farm
    window.NFStore = {async call(n) { return n === "farm_load" ? s : n === "farm_save" ? {ok: true} : null; }};
  })();
</script>
<script>if (location.hash === "#art") document.write('<script src="../ui/farm/art/manifest.js"><\/script>');   // the painted run</script>
<script src="../ui/pet/petart.js"></script><script src="../ui/farm/farmart.js"></script><script src="../ui/farm/farm.js"></script>
<script>
  const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const $$ = (q) => [...document.querySelectorAll(q)];
  const ART = location.hash === "#art", door = (m) => document.querySelector(`${ART ? ".nf-spot" : ".nf-ws"}[data-maker="${m}"]`);
  const hit = (el) => el.dispatchEvent(new MouseEvent("click", {bubbles: true}));     // (an SVG place has no .click())
  const cooking = () => NF.state().cooking.length;
  (async () => {
    const r = {};
    try {
      await wait(200);
      NF.go("make");
      r.yard = $$(ART ? ".nf-spot" : ".nf-ws").map((b) => b.dataset.maker);
      r.painted = !!document.querySelector(".nf-scene img") && !document.querySelector(".nf-ws");
      r.kitchenBadge = ART ? (/1 ready to collect/.test(door("kitchen").getAttribute("aria-label")) ? "1" : "")
        : (document.querySelector('.nf-ws[data-maker="kitchen"] .nf-badge') || {}).textContent || "";
      r.millLine = ART ? door("mill").getAttribute("aria-label").replace(/^Mill: /, "") : document.querySelector('.nf-ws[data-maker="mill"] .nf-ws-line').textContent;
      r.noSheetYet = !document.querySelector("#nf-sheet");
      hit(door("kitchen"));
      r.sheet = !!document.querySelector("#nf-sheet");
      r.recipes = $$("#nf-sheet .nf-recipe").length;
      r.kitchenRecipes = Object.keys(FarmCore.RECIPES).filter((k) => FarmCore.RECIPES[k].at === "kitchen").length;
      const before = cooking();
      document.querySelector('#nf-sheet [data-cook="bread"]').click();
      await wait(150);
      r.cooked = cooking() - before;
      r.sheetStaysOpen = !!document.querySelector("#nf-sheet");
      const locked = document.querySelector('#nf-sheet [data-cook="melonsorbet"]');
      r.lockedSays = locked.getAttribute("aria-disabled") === "true" && /level 4 kitchen/i.test(locked.title);
      const b2 = cooking(); locked.click(); await wait(150);
      r.lockedCooks = cooking() - b2;
      r.lockedToast = /level 4 kitchen/i.test(document.querySelector("#nf-toasts").textContent);
      const bread = NF.state().silo.bread || 0;
      document.querySelector("#nf-sheet .nf-slot.done").click();
      await wait(150);
      r.collected = (NF.state().silo.bread || 0) - bread;
      // the queue and the stoves (Cam: "add queing ... adding extra stoves")
      const st = () => NF.state();
      document.querySelector('#nf-sheet [data-cook="bread"]').click(); await wait(150);       // the last free stove
      r.fullSays = document.querySelector('#nf-sheet [data-cook="bread"] .nf-recipe-go').textContent.trim();
      const wheat = st().silo.wheat;
      document.querySelector('#nf-sheet [data-cook="bread"]').click(); await wait(150);
      r.queued = st().queue.length === 1 && document.querySelectorAll("#nf-sheet .nf-qitem").length === 1 && st().silo.wheat === wheat - 3;
      document.querySelector("#nf-sheet .nf-qitem").click(); await wait(150);
      r.unqueued = st().queue.length === 0 && st().silo.wheat === wheat;
      document.querySelector('#nf-sheet [data-cook="bread"]').click(); await wait(150);
      const busyBefore = st().cooking.filter((c) => !c.done).length;
      document.querySelector('#nf-sheet [data-build="stove"]').click(); await wait(150);
      r.stove = st().stoves === 1 && st().queue.length === 0 && st().cooking.filter((c) => !c.done).length === busyBefore + 1;
      r.stoveHead = /Makes 4 at a time \(1 extra stove\)/.test(document.querySelector("#nf-sheet .nf-sheet-head").textContent);
      document.dispatchEvent(new KeyboardEvent("keydown", {key: "Escape"}));
      await wait(50);
      r.escCloses = !document.querySelector("#nf-sheet");
      hit(door("mill"));
      r.millBuild = !!document.querySelector('#nf-sheet [data-build="mill"]');
      document.querySelector("#nf-sheet").click();                          // the dim backdrop closes it
      r.backdropCloses = !document.querySelector("#nf-sheet");
      r.homely = getComputedStyle(document.documentElement).getPropertyValue("color-scheme").trim();
      // the farm page: the whole width (Cam: "i want the game area to be larger so i can see what is on the farm easier")
      NF.go("farm"); await wait(100);
      r.noSidePanel = !document.querySelector(".nf-inspect") && !!document.querySelector(".nf-strip .nf-stat");
      const land = document.querySelector(".nf-land"), main = document.querySelector("#nf-main");
      r.landWide = land.getBoundingClientRect().width / main.clientWidth;
      const tile = document.querySelector('.nf-tile[data-x="1"][data-y="1"]');
      tile.dispatchEvent(new MouseEvent("mouseenter"));
      const cap = document.querySelector("#nf-hover");
      r.caption = !cap.hidden && /soil|grass/i.test(cap.textContent);
      document.querySelector("#nf-grid").dispatchEvent(new MouseEvent("mouseleave"));
      r.captionHides = document.querySelector("#nf-hover").hidden;
      r.tilePx = Math.round(tile.getBoundingClientRect().width);
      hit(document.querySelector(".nf-tile.house")); await wait(50);
      const fl = document.querySelector("#nf-float");
      r.floatCard = !fl.hidden && /Chicken coop/.test(fl.textContent) && fl.querySelectorAll(".nf-x").length === 1;
      document.dispatchEvent(new KeyboardEvent("keydown", {key: "Escape"})); await wait(50);
      r.floatCloses = document.querySelector("#nf-float").hidden;
      if (ART) {
        const before = r.tilePx;
        hit(document.querySelector('[data-zoom="whole"]')); await wait(50);
        r.zoomWhole = document.querySelector(".nf-land").classList.contains("z-whole");
        r.closeBigger = before > document.querySelector('.nf-tile[data-x="1"][data-y="1"]').getBoundingClientRect().width;
      }
    } catch (e) { r.error = String(e && e.stack || e); }
    document.getElementById("out").textContent = JSON.stringify(r);
  })();
</script>
</body></html>
